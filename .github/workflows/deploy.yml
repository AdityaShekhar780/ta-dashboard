name: Deploy to Firebase Hosting

# Runs whenever something is saved to the main branch: a code change, or new numbers
# published from the TA data sheet (public/data/*.json).
on:
  push:
    branches:
      - main
  workflow_dispatch: # lets you run it by hand from the Actions tab

# If two saves arrive close together, only the newest one is deployed.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TA_DASHBOARD_CB04D }}
          projectId: ta-dashboard-cb04d
          channelId: live
